<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Я пожилой калькулятор</title>
<link rel="stylesheet" href="style.css?2">
</head>
<body>

<h1>Калькулятор крафтов</h1>

<div class="row">
    <input id="itemInput" list="itemsList" placeholder="Введите предмет">
    <datalist id="itemsList"></datalist>

    <button onclick="addCraft()">Добавить</button>
</div>

<div class="row">
    <label>
        <input type="checkbox" id="deepBreakdown" checked>
        Разобрать до самых базовых ингредиентов
    </label>
</div>

<div id="craftList"></div>

<div class="row">
    <button onclick="calculate()">Посчитать</button>
</div>

<h2>Результат</h2>
<div id="result"></div>
<script src="script.js?4"></script>
</body>
</html>
